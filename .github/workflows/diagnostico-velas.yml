name: Diagnóstico de velas
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          U=$(python3 -c "import json;print(json.load(open('content/ajustes.json'))['supabaseUrl'])")
          K=$(python3 -c "import json;print(json.load(open('content/ajustes.json'))['supabaseAnonKey'])")
          {
          echo "== velas_semana"; curl -s "$U/rest/v1/velas_semana?select=id,rezos,created_at&order=created_at.desc&limit=3" -H "apikey: $K"; echo
          ID=$(curl -s "$U/rest/v1/velas_semana?select=id&order=created_at.desc&limit=1" -H "apikey: $K" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['id'] if d else '')")
          echo "== vela $ID"
          echo "== insert rezo (ignore-duplicates)"; curl -s -w " HTTP %{http_code}" -X POST "$U/rest/v1/rezos" -H "apikey: $K" -H "Content-Type: application/json" -H "Prefer: return=minimal,resolution=ignore-duplicates" -d "{\"vela_id\":\"$ID\",\"visitante\":\"diag-$RANDOM$RANDOM\"}"; echo
          echo "== insert rezo (simple)"; curl -s -w " HTTP %{http_code}" -X POST "$U/rest/v1/rezos" -H "apikey: $K" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d "{\"vela_id\":\"$ID\",\"visitante\":\"diag-$RANDOM$RANDOM\"}"; echo
          echo "== después"; curl -s "$U/rest/v1/velas_semana?select=id,rezos&id=eq.$ID" -H "apikey: $K"; echo
          } > diagnostico-velas.txt 2>&1
          cat diagnostico-velas.txt
          git config user.name "Rezo Diario (diagnóstico)"; git config user.email "audios@rezodiario.com"
          git add diagnostico-velas.txt && git commit -m "Diagnóstico de velas" && git pull --rebase && git push
