# Vuelve a generar la web cada noche para que «hoy» cambie solo.
# Guarda el «deploy hook» de Cloudflare Pages como secreto del repositorio NETLIFY_BUILD_HOOK.
name: Publicar el rezo de cada día
on:
  schedule:
    - cron: "1 23 * * *"   # 00:01 en invierno y 01:01 en verano (hora de Madrid)
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar al alojamiento
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]"'"'"'')"
          if [ -z "$HOOK" ]; then echo "::error::El secreto NETLIFY_BUILD_HOOK está vacío o no existe en Repository secrets."; exit 1; fi
          case "$HOOK" in
            https://*) ;;
            *) echo "::error::El secreto NETLIFY_BUILD_HOOK no empieza por https://. Pega la URL completa del deploy hook de Cloudflare (empieza por https://api.cloudflare.com/...)."; exit 1;;
          esac
          echo "Llamando al deploy hook (${#HOOK} caracteres)…"
          curl -fsS -X POST "$HOOK"
          echo
          echo "Listo: la web se está publicando de nuevo."
