name: tmp html
on: workflow_dispatch
permissions:
  contents: write
jobs:
  h:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          curl -sSL -A "Mozilla/5.0" https://www.dominicos.org/predicacion/evangelio-del-dia/20-10-2026/ -o lab.html
          curl -sSL -A "Mozilla/5.0" https://www.dominicos.org/predicacion/evangelio-del-dia/25-10-2026/ -o dom.html
          git init -q && git checkout -q -b tmp-html && git add . && git -c user.name=x -c user.email=x@x commit -qm h
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-html
